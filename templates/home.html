<!DOCTYPE html>
<html>
<head><title>VibeShare - ICS4U</title></head>
<style>
    body { background: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; }
    .header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 20px; }
    .tabs { margin: 20px 0; }
    .tabs a { color: #888; text-decoration: none; margin-right: 20px; font-weight: bold; }
    .tabs a.active { color: #ffb703; border-bottom: 2px solid #ffb703; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #161616; padding: 15px; border-radius: 10px; }
</style>
<body>
    <div class="header">
        <h1>⚡ VibeShare</h1>
        <div>{{ username }} | <a href="/logout" style="color:red;">登出</a></div>
    </div>

    <div class="tabs">
        <a href="{{ url_for('home', tab='explore') }}" class="{{ 'active' if current_tab == 'explore' }}">Explore World</a>
        <a href="{{ url_for('home', tab='my_studio') }}" class="{{ 'active' if current_tab == 'my_studio' }}">My Studio</a>
    </div>

    <div class="grid">
        {% for video in videos %}
        <div class="card">
            <video src="{{ video.video_url }}" controls style="width: 100%;"></video>
            <h3>{{ video.title }}</h3>
            <p>发布者: {{ video.username }}</p>
            {% if current_tab == 'my_studio' %}
            <form action="{{ url_for('delete_video', video_id=video.id) }}" method="POST">
                <button style="background:red; color:#fff; border:none; width:100%;">删除视频</button>
            </form>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
