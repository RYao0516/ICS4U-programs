<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeShare</title>
    <style>
        body { background: #f4f7f6; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 15px; margin: 0; }
        .header { background: #fff; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .tabs { margin: 20px 0; display: flex; gap: 15px; background: #fff; padding: 10px; border-radius: 8px; overflow-x: auto; }
        .tabs a { color: #666; text-decoration: none; font-weight: 600; white-space: nowrap; }
        .tabs a.active { color: #007bff; border-bottom: 2px solid #007bff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
        
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video { width: 100%; border-radius: 4px; background: #eee; }
        
        button { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .upload-section { background: #fff; margin-top: 30px; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ VibeShare</h1>
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="/profile" style="text-decoration:none; color:#333; display:flex; align-items:center; gap:8px;">
                {% if user_info.avatar_url %}
                    <img src="{{ user_info.avatar_url }}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                {% else %}
                    <div style="width:35px; height:35px; border-radius:50%; background:#ddd; display:flex; align-items:center; justify-content:center;">
                        {{ user_info.username[0].upper() }}
                    </div>
                {% endif %}
                <strong>{{ user_info.username }}</strong>
            </a>
            <a href="/logout" style="color:#666; margin-left:10px;">Logout</a>
        </div>
    </div>

    <div class="tabs">
        <a href="{{ url_for('home', tab='explore') }}" class="{{ 'active' if current_tab == 'explore' }}">Explore World</a>
        <a href="{{ url_for('home', tab='my_studio') }}" class="{{ 'active' if current_tab == 'my_studio' }}">My Studio</a>
    </div>

    <div class="grid">
        {% for video in videos %}
        <div class="card">
            <video src="{{ video.video_url }}" controls></video>
            <h3>{{ video.title }}</h3>
            <p>By: {{ video.username }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="upload-section">
        <h3>Upload New Video</h3>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Title" required style="width:90%; padding:8px; margin-bottom:10px;">
            <input type="file" name="file" required style="width:90%; margin-bottom:10px;">
            <br>
            <button type="submit">Publish</button>
        </form>
    </div>
</body>
</html>
