<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VibeShare - Login</title>
    <style>
        body { background-color: #0d0d0d; color: #e5e5e5; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #161616; padding: 40px; border-radius: 10px; border: 1px solid #262626; text-align: center; width: 300px; }
        h2 { color: #fff; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #262626; border: 1px solid #404040; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #ffb703; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .flash { color: #ff4d4d; font-size: 14px; margin-bottom: 10px; }
        a { color: #ffb703; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ Login to VibeShare</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
          {% endif %}
        {% endwith %}
        <form action="{{ url_for('login') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p style="margin-top: 20px; font-size: 14px; color: #8c8c8c;">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</body>
</html>
